name: Discord preview

# Draws every Discord notification type as a mock Discord message, for the
# pull request's merge commit and for the base it lands on, then keeps one
# comment showing what changed. The render job runs pull request code with a
# read-only token. Only the comment job can write: it hosts the images on a
# per-PR prerelease and never checks out or runs that code. Fork pull requests
# get a read-only token, so their preview stays in the run summary and artifact.
on:
  pull_request:
    paths:
      - worker/**
      - shared/**
      - scripts/discord-preview.ts
      - .github/workflows/discord-preview.yml

permissions:
  contents: read

concurrency:
  group: discord-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Render notifications
        env:
          IMAGES: https://github.com/${{ github.repository }}/releases/download/discord-preview-pr-${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The merge commit's first parent is the base. It is checked out inside
          # the workspace so its modules resolve hono from this install, and this
          # branch's catalogue renders both sides.
          git worktree add --detach .preview-base HEAD^1
          mkdir preview
          node scripts/discord-preview.ts render .preview-base > preview/base.json
          node scripts/discord-preview.ts render . > preview/head.json
          # Image names carry the commit, so GitHub's image proxy never shows a stale one.
          node scripts/discord-preview.ts compare preview/base.json preview/head.json preview "$IMAGES/${HEAD_SHA::7}-"
          {
            cat preview/comment.md
            echo
            echo "Images are hosted only for pull requests from this repository. They are also in this run's \`discord-preview\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: discord-preview
          if-no-files-found: error
          path: |
            preview/comment.md
            preview/*.png

  comment:
    needs: render
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: discord-preview
      - name: Host the images
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Recreated on every run, so it only holds the images the comment shows.
          tag="discord-preview-pr-$PR"
          shopt -s nullglob
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" ./*.png --prerelease --title "Discord preview for #$PR" \
            --notes "Images for the Discord notification preview on #$PR. Deleted when the pull request closes."
      - name: Update the preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- discord-notification-preview -->'
          {
            echo "$marker"
            cat comment.md
            echo
            echo "<sub>Mock Discord messages drawn from the samples in \`scripts/discord-preview.ts\` at $HEAD_SHA.</sub>"
          } > body.md
          id=$(gh api --paginate "repos/$GH_REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@body.md > /dev/null
          else
            gh pr comment "$PR" --body-file body.md
          fi
