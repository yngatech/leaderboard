name: Deployments

# Workers Builds reports each deployment as a check run. Mirror it as a GitHub
# deployment so pull requests link their preview and the repository lists the
# production site.
on:
  check_run:
    types: [completed]

permissions:
  deployments: write

jobs:
  production:
    if: >-
      github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
      github.event.check_run.name == 'Workers Builds: leaderboard' &&
      github.event.check_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Record deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.check_run.head_sha }}
          BUILD_URL: ${{ github.event.check_run.details_url }}
        run: |
          id=$(jq -n --arg ref "$SHA" '{ref: $ref, environment: "production",
            auto_merge: false, required_contexts: [],
            transient_environment: false, production_environment: true}' |
            gh api "repos/$GH_REPO/deployments" --input - --jq .id)
          jq -n --arg log "$BUILD_URL" '{state: "success",
            environment_url: "https://leaderboard.ynga.tech", log_url: $log}' |
            gh api "repos/$GH_REPO/deployments/$id/statuses" --input - --silent

  preview:
    if: >-
      github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
      github.event.check_run.name == 'Workers Builds: leaderboard-preview' &&
      github.event.check_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Record deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.check_run.head_sha }}
          SUMMARY: ${{ github.event.check_run.output.summary }}
          BUILD_URL: ${{ github.event.check_run.details_url }}
        run: |
          url=$(grep -oP '^Preview Alias URL: \Khttps://\S+' <<< "$SUMMARY" ||
            grep -oP '^Preview URL: \Khttps://\S+' <<< "$SUMMARY")
          # The first live-board read starts the preview's isolated alarm chain.
          curl --fail --silent --show-error --max-time 120 "$url/api/board" --output /dev/null
          id=$(jq -n --arg ref "$SHA" '{ref: $ref, environment: "preview",
            auto_merge: false, required_contexts: [],
            transient_environment: true, production_environment: false}' |
            gh api "repos/$GH_REPO/deployments" --input - --jq .id)
          jq -n --arg url "$url" --arg log "$BUILD_URL" '{state: "success",
            environment_url: $url, log_url: $log, auto_inactive: false}' |
            gh api "repos/$GH_REPO/deployments/$id/statuses" --input - --silent
